syntax = "proto3";

package orderbook;

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BID = 1;
  SIDE_ASK = 2;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC = 1;
  TIME_IN_FORCE_IOC = 2;
  TIME_IN_FORCE_FOK = 3;
  TIME_IN_FORCE_POST_ONLY = 4;
}

enum MarketPhase {
  MARKET_PHASE_UNSPECIFIED = 0;
  MARKET_PHASE_OPEN = 1;
  MARKET_PHASE_AUCTION = 2;
  MARKET_PHASE_CLOSED = 3;
}

message PlaceLimit {
  uint64 id = 1;
  Side side = 2;
  uint32 price = 3;
  uint64 qty = 4;
  string market_id = 5;
  TimeInForce time_in_force = 6;
}

message PlaceMarket {
  uint64 id = 1;
  Side side = 2;
  uint64 qty = 3;
  string market_id = 4;
}

message Amend {
  uint64 id = 1;
  string market_id = 2;
  optional uint32 price = 3;
  optional uint64 qty = 4;
}

message SetMarketPhase {
  string market_id = 1;
  MarketPhase phase = 2;
}

message RunAuction {
  string market_id = 1;
  MarketPhase next_phase = 2;
}

message Cancel {
  uint64 id = 1;
  string market_id = 2;
  uint64 qty = 3;
}

message OrderCommand {
  oneof cmd {
    PlaceLimit place_limit = 1;
    PlaceMarket place_market = 2;
    Cancel cancel = 3;
    Amend amend = 4;
    SetMarketPhase set_market_phase = 5;
    RunAuction run_auction = 6;
  }
}

enum DoneReason {
  DONE_REASON_UNSPECIFIED = 0;
  DONE_REASON_FILLED = 1;
  DONE_REASON_CANCELED = 2;
  DONE_REASON_REJECTED = 3;
}

message TradeEvent {
  uint64 taker_id = 1;
  uint64 maker_id = 2;
  uint32 price = 3;
  uint64 qty = 4;
}

message DoneEvent {
  uint64 order_id = 1;
  DoneReason reason = 2;
}

message AckEvent {
  uint64 order_id = 1;
}

message UpdateEvent {
  uint64 order_id = 1;
  uint32 price = 2;
  uint64 qty_remaining = 3;
}

message Event {
  oneof kind {
    TradeEvent trade = 1;
    DoneEvent done = 2;
    AckEvent ack = 3;
    UpdateEvent update = 4;
  }
}

message OrderSnapshot {
  uint64 id = 1;
  uint32 price = 2;
  uint64 qty_remaining = 3;
  Side side = 4;
  bool live = 5;
  TimeInForce time_in_force = 6;
}

message LevelSnapshot {
  uint32 price = 1;
  repeated uint64 order_ids = 2;
}

message OrderBookSnapshot {
  repeated OrderSnapshot orders = 1;
  repeated LevelSnapshot bids = 2;
  repeated LevelSnapshot asks = 3;
  MarketPhase phase = 4;
}

message MarketSnapshot {
  string market_id = 1;
  OrderBookSnapshot book = 2;
}

message StateSnapshot {
  uint64 last_sequence = 1;
  repeated MarketSnapshot markets = 2;
}
